<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 · 单位管理系统</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm">
    <h1>单位管理系统</h1>
    <p class="sub">人员 · 部门 · 权限 / 统计导出</p>

    <label style="display:block;margin-bottom:12px;font-size:12px;color:#6b7280">账号
      <input id="username" name="username" autocomplete="username"
             style="width:100%;margin-top:5px" placeholder="请输入账号" required>
    </label>
    <label style="display:block;margin-bottom:8px;font-size:12px;color:#6b7280">密码
      <input id="password" name="password" type="password" autocomplete="current-password"
             style="width:100%;margin-top:5px" placeholder="请输入密码" required>
    </label>
    <div id="err" style="color:#dc2626;font-size:12px;height:18px"></div>
    <button type="submit" style="width:100%;height:36px">登 录</button>

    <div class="demo-accounts">
      演示账号：<br>
      admin / admin123（超级管理员，全单位）<br>
      zhangwei / manager123（部门管理员，研发中心）<br>
      wangfang / 123456（普通员工，只能看本部门）
    </div>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const err = document.getElementById('err');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  const btn = form.querySelector('button');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const body = await res.json();
    if (body.code !== 0) {
      err.textContent = body.message || '登录失败';
      return;
    }
    const land = { ADMIN: '/index.html', DEPT_MANAGER: '/index.html', STAFF: '/index.html' };
    location.href = land[body.data.roleCode] || '/index.html';
  } catch (ex) {
    err.textContent = '连接后端失败：' + ex.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
